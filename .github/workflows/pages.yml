# Publishes the docs site (and the registry JSON under /r) to GitHub Pages as a static export.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions". The site is served at
# https://<owner>.github.io/<repo>/ (a project site), which is why the build gets a base path; for a
# custom domain or a user site, set STATIC_BASE_PATH to "" and the two URLs to that origin.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` regenerates the registry first (turbo root task); the registry items embed the public
      # origin in their registryDependencies, so both URLs must be the Pages origin including the base path.
      - run: pnpm build
        env:
          STATIC_EXPORT: "1"
          STATIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          REGISTRY_URL: ${{ env.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out
      - id: deploy
        uses: actions/deploy-pages@v4
