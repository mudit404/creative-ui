name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:registry
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          REGISTRY_URL: http://localhost:3100
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  install-check:
    # Proves the registry installs into a clean project and that project builds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:registry
        env:
          REGISTRY_URL: http://localhost:3100
      - name: Serve the registry and install into examples/vite-consumer
        run: |
          (cd apps/docs && npx serve -l 3100 public >/dev/null 2>&1 &)
          sleep 2
          # every registry:ui item, so the consumer's App.tsx (which uses them all) compiles
          urls() { node -e "console.log(require('$GITHUB_WORKSPACE/registry/registry.json').items.filter((i) => i.type === 'registry:ui').map((i) => 'http://localhost:3100/r/' + i.name + '.json').join(' '))"; }
          cd examples/vite-consumer
          pnpm install
          pnpm dlx shadcn@latest add $(urls) --yes --overwrite
          pnpm build
